server:
  port: 8080

spring:
  application:
    name: accounting-ledger-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

ledger:
  webhook:
    secret: ${LEDGER_WEBHOOK_SECRET:super-secret-shared-key-2026}
    default-bank-account: "1000-BANK"
    default-revenue-account: "4000-SALES"
