server:
  port: 8080

spring:
  application:
    name: accounting-ledger-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:ledger_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

ledger:
  webhook:
    secret: ${LEDGER_WEBHOOK_SECRET:super-secret-shared-key-2026}
    default-bank-account: "1000-BANK"
    default-revenue-account: "4000-SALES"
