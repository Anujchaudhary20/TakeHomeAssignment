server:
  port: 8080

spring:
  application:
    name: accounting-ledger-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

ledger:
  seed-data:
    enabled: false
  webhook:
    secret: "test-webhook-secret-key-123"
    default-bank-account: "1000-BANK"
    default-revenue-account: "4000-SALES"
